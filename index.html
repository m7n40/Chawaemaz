<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chawarmaz - Casablanca</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ff9800;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 15px auto;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-call {
            background-color: #ff9800;
            color: #ffffff;
        }
        .btn-glovo {
            background-color: #ffc107;
            color: #000000;
        }
        .section-title {
            color: #ff9800;
            margin-top: 30px;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .image-container {
            margin: 20px auto;
            max-width: 500px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            background-color: #2a2a2a;
        }
        .image-container img {
            width: 100%;
            display: block;
        }
        .image-caption {
            background-color: #2a2a2a;
            padding: 10px;
            font-size: 14px;
            color: #ff9800;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>CHAWARMAZ</h1>

    <a href="tel:0679602492" class="btn btn-call">📞 Appeler pour commander</a>
    <a href="https://glovoapp.com" target="_blank" class="btn btn-glovo">💛 Commander via Glovo</a>

    <div class="section-title">NOTRE MENU & SPÉCIALITÉS</div>

    <div class="image-container">
        <img src="menu.jpg" alt="Carte du Restaurant">
        <div class="image-caption">📋 Carte du Restaurant</div>
    </div>

    <div class="image-container">
        <img src="chawarma_delice.jpg" alt="Les Nouveautés">
        <div class="image-caption">🔥 Les Nouveautés</div>
    </div>

    <div class="image-container">
        <img src="kebab_tacos.jpg" alt="Kebab et Tacos">
        <div class="image-caption">🌯 Kebab & Tacos</div>
    </div>

</body>
</html>
